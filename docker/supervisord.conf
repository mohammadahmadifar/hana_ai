; ------------------------------------------------------------------
; نقش web: nginx و php-fpm کنار هم در یک ظرف
;
; کارگر صف و زمان‌بند اینجا نیستند — آن‌ها ظرف جدا دارند تا ری‌استارت
; کارگر (تلهٔ «کد عوض شد ولی کارگر نفهمید») به وب دست نزند.
; ------------------------------------------------------------------
[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = /usr/local/bin/php-fpm -F
autostart = true
autorestart = true
startretries = 3
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:nginx]
command = /usr/sbin/nginx -g "daemon off;"
autostart = true
autorestart = true
startretries = 3
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
