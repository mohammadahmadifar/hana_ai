# ------------------------------------------------------------------
# سایت پنل «هانا» داخل ظرف
#
# همان تنظیمات گام ۷ راهنمای نصب است، با دو تفاوت:
#   - داخل ظرف روی پورت ۸۰ گوش می‌دهد؛ پورت بیرونی را docker-compose
#     تعیین می‌کند (HANA_PORT).
#   - php-fpm روی 127.0.0.1:9000 است نه سوکت یونیکس، تا مسیر نسخه‌دار
#     (php8.4-fpm.sock) در فایل نیفتد.
# ------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    root /app/panel/public;
    index index.php;
    charset utf-8;

    # مدارک اسکن‌شده بزرگ‌اند
    client_max_body_size 60m;
    client_body_timeout 300s;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;

        # OCR طول می‌کشد
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # هیچ فایل PHP دیگری از وب اجرا نمی‌شود
    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* { deny all; }
}
