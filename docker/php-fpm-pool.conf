; ------------------------------------------------------------------
; استخر php-fpm پنل «هانا»
; جایگزین پوشهٔ www.conf پیش‌فرض دبیان است.
; ------------------------------------------------------------------
[hana]

user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; ⚠️ بدون این خط، متغیرهای محیطی داکر (DB_*، REDIS_*، HANA_*) به PHP
; نمی‌رسند و پنل با «Access denied» بالا می‌آید در حالی که همه‌چیز درست است.
clear_env = no

; خروجی و خطای PHP به لاگ ظرف برود، نه به فایلی که کسی نمی‌بیندش
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2

; هم‌خوان با fastcgi_read_timeout در nginx
request_terminate_timeout = 300
